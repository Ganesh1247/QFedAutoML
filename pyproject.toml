[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qfedautoml"
version = "0.1.0"
description = "Quantum-Enhanced Federated AutoML Platform for Privacy-Preserving Intelligent Systems"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "QFedAutoML Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "flwr>=1.7.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.13.0",
    "pennylane>=0.35.0",
    "optuna>=3.5.0",
    "opacus>=1.4.0",
    "shap>=0.45.0",
    "lime>=0.2.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "black>=24.2.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]


[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
