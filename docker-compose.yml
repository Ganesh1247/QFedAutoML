version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qfed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qfed_user
      POSTGRES_PASSWORD: qfed_password
      POSTGRES_DB: qfed_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qfed_user -d qfed_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: qfed_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qfed_user:qfed_password@postgres:5432/qfed_db
      SECRET_KEY: dev-secret-key-for-local-containerized-testing
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    container_name: qfed_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
